<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 防瀏覽器快取 (確保 iPad 隨時抓到最新版) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <title>亞馬森特寵專科醫院 - 櫃台周邊生活與即時停車導覽 v1.0.3</title>
  
  <!-- iOS PWA 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="亞馬森導覽">
  <meta name="theme-color" content="#1B4332">
  <link rel="manifest" href="manifest.json?v=103">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Noto Sans TC -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --primary-dark: #112d20;
      --primary: #1B4332;
      --primary-light: #2D6A4F;
      --primary-accent: #40916C;
      --accent-green: #52B788;
      --accent-gold: #D4A373;
      --accent-warm: #E76F51;
      --bg-cream: #F8F9FA;
      --card-bg: #FFFFFF;
      --text-main: #212529;
      --text-muted: #6C757D;
      --border-subtle: #E9ECEF;
      --shadow-soft: 0 4px 16px rgba(17, 45, 32, 0.08);
      --shadow-hover: 0 8px 24px rgba(17, 45, 32, 0.14);
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-cream);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 頂部標題列 (亞馬森雨林森林綠風格) */
    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 65%, var(--primary-light) 100%);
      color: #FFFFFF;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* 醫院 Logo 徽章容器 */
    .brand-logo-container {
      width: 52px;
      height: 52px;
      background: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
      border: 2px solid var(--accent-gold);
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
    }

    .brand-titles h1 {
      font-size: 1.28rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 1.2;
    }

    .brand-titles h1 span.en {
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.85;
      letter-spacing: 0.5px;
      color: #D8F3DC;
    }

    .brand-titles p {
      font-size: 0.78rem;
      color: #B7E4C7;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.15);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #52B788;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(82, 183, 136, 0.7);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(82, 183, 136, 0.8); }
      70% { box-shadow: 0 0 0 8px rgba(82, 183, 136, 0); }
      100% { box-shadow: 0 0 0 0 rgba(82, 183, 136, 0); }
    }

    .btn-header {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .btn-header:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.25);
    }

    /* 分類過濾條 */
    .filter-bar {
      background: #FFFFFF;
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-subtle);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      flex-shrink: 0;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: #F1F5F3;
      color: var(--primary);
      border: 1.5px solid transparent;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .filter-chip i {
      font-size: 1rem;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(27, 67, 50, 0.28);
      border-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .filter-chip:active {
      transform: scale(0.95);
    }

    /* 主內容區域 (左右分欄: iPad 專用優化比例) */
    .main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* 左側 Google Maps 地圖 (佔 62%) */
    #map-container {
      flex: 1;
      height: 100%;
      position: relative;
      background: #E8ECE9;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 地圖浮動控制項 */
    .map-floating-controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 800;
      display: flex;
      gap: 8px;
    }

    .btn-float {
      background: #FFFFFF;
      color: var(--primary);
      border: 1px solid rgba(27, 67, 50, 0.2);
      padding: 8px 15px;
      border-radius: 24px;
      box-shadow: var(--shadow-soft);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-float:active {
      transform: scale(0.95);
      background: #F1F5F3;
    }

    .distance-legend {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(6px);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      border: 1px solid rgba(27, 67, 50, 0.15);
      z-index: 800;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-circle {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    /* 右側資訊專區 (獨立流暢捲動，焦點卡片完整展開不被截) */
    .sidebar {
      width: 440px;
      max-width: 42%;
      background: #FAF8F5;
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: -4px 0 16px rgba(0, 0, 0, 0.04);
      z-index: 900;
      padding-bottom: 28px;
    }

    .sidebar-header {
      padding: 14px 18px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 950;
    }

    .sidebar-header h2 {
      font-size: 1.05rem;
      color: var(--primary-dark);
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .count-badge {
      background: var(--primary-accent);
      color: #fff;
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* 焦點卡片 (Focus Detail Card: 完整展開) */
    .focus-card {
      margin: 14px 16px 8px;
      background: #FFFFFF;
      border-radius: var(--radius-lg);
      border: 2px solid var(--accent-gold);
      box-shadow: 0 6px 20px rgba(27, 67, 50, 0.1);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      flex-shrink: 0;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .focus-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: linear-gradient(135deg, var(--accent-gold), #B57F50);
      color: #FFFFFF;
      font-size: 0.72rem;
      font-weight: 900;
      padding: 4px 12px;
      border-bottom-left-radius: 10px;
      letter-spacing: 0.5px;
    }

    .focus-title-group h3 {
      font-size: 1.22rem;
      color: var(--primary-dark);
      font-weight: 900;
      margin-bottom: 4px;
      padding-right: 60px;
      line-height: 1.3;
    }

    .focus-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tag {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 16px;
      font-weight: 700;
    }

    .tag-walk {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .tag-category {
      background: #EFEBE9;
      color: #5D4037;
    }

    .tag-closed {
      background: #FFE3E3;
      color: #D90429;
      font-weight: 900;
    }

    /* 車位即時大儀表 */
    .parking-meter {
      background: #F4FBF7;
      border: 1.5px solid #C7EAD8;
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .meter-left {
      display: flex;
      flex-direction: column;
    }

    .meter-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .meter-status-text {
      font-size: 0.82rem;
      font-weight: 900;
      margin-top: 2px;
    }

    .meter-right {
      display: flex;
      align-items: baseline;
      gap: 3px;
    }

    .meter-number {
      font-size: 2.1rem;
      font-weight: 900;
      font-family: 'Arial Black', sans-serif;
      line-height: 1;
    }

    .meter-unit {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .status-plenty { color: #2D6A4F; }
    .status-warning { color: #D47A00; }
    .status-full { color: #D90429; }

    .focus-desc {
      font-size: 0.86rem;
      line-height: 1.55;
      color: #495057;
      background: #FAF8F5;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border-left: 3px solid var(--primary-accent);
    }

    .focus-desc strong {
      color: var(--primary-dark);
    }

    /* QR Code 導航掃碼區 */
    .qrcode-section {
      background: linear-gradient(135deg, #143626 0%, #1B4332 100%);
      color: #FFFFFF;
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 4px 12px rgba(20, 54, 38, 0.18);
    }

    .qrcode-wrapper {
      background: #FFFFFF;
      padding: 6px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 92px;
      height: 92px;
    }

    .qrcode-wrapper canvas, .qrcode-wrapper img {
      width: 80px !important;
      height: 80px !important;
    }

    .qrcode-info {
      flex: 1;
    }

    .qrcode-info h4 {
      font-size: 0.95rem;
      font-weight: 900;
      color: #D8F3DC;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
    }

    .qrcode-info p {
      font-size: 0.75rem;
      color: #B7E4C7;
      line-height: 1.35;
      margin-bottom: 7px;
    }

    .btn-direct-nav {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent-gold);
      color: #143626;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 900;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-direct-nav:active {
      transform: scale(0.96);
    }

    /* 列表清單區 */
    .item-list {
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .list-card {
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .list-card:active, .list-card.selected {
      border-color: var(--primary-accent);
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.12);
      transform: translateX(3px);
      background: #F8FAF9;
    }

    .list-card.card-disabled {
      opacity: 0.65;
      background: #F8F9FA;
    }

    .card-info {
      flex: 1;
    }

    .card-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .icon-parking { background: #E8F5E9; color: #1B4332; }
    .icon-food { background: #FFF3E0; color: #E65100; }
    .icon-atm { background: #E1F5FE; color: #0277BD; }
    .icon-park { background: #F1F8E9; color: #33691E; }
    .icon-store { background: #FCE4EC; color: #C2185B; }

    .card-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--primary-dark);
      line-height: 1.25;
    }

    .card-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      gap: 6px;
      margin-top: 3px;
    }

    .card-side {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
    }

    .badge-pill {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    /* 地圖自訂 Marker 樣式 */
    .custom-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 3px 10px rgba(0,0,0,0.35);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .custom-marker:hover, .custom-marker.active {
      transform: scale(1.25);
      z-index: 9999 !important;
    }

    .marker-amazon {
      width: 48px;
      height: 48px;
      background: #143626;
      border: 3px solid #D4A373;
      color: #FFFFFF;
      font-size: 20px;
    }

    .marker-parking {
      width: 36px;
      height: 36px;
      background: #2D6A4F;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-size: 15px;
    }

    .marker-food {
      width: 34px;
      height: 34px;
      background: #E76F51;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-size: 14px;
    }

    .marker-atm {
      width: 34px;
      height: 34px;
      background: #0077B6;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-size: 14px;
    }

    .marker-park {
      width: 34px;
      height: 34px;
      background: #52B788;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-size: 14px;
    }

    .marker-store {
      width: 34px;
      height: 34px;
      background: #9D4EDD;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      font-size: 14px;
    }

    .parking-bubble {
      background: #143626;
      color: #fff;
      padding: 2px 7px;
      border-radius: 10px;
      font-size: 0.7rem;
      font-weight: 800;
      position: absolute;
      top: -11px;
      right: -15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
      border: 1px solid #fff;
      white-space: nowrap;
    }

    @media (max-width: 900px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-width: 100%;
        height: 50%;
        border-left: none;
        border-top: 1px solid var(--border-subtle);
      }
      #map-container {
        height: 50%;
      }
    }
  </style>
</head>
<body>

  <!-- 頂部亞馬森專屬導航 (含真實 Logo 與 v1.0.3) -->
  <header>
    <div class="brand-group">
      <div class="brand-logo-container">
        <img src="logo.svg?v=103" alt="亞馬森 Logo" class="brand-logo-img" id="brand-logo-img">
      </div>
      <div class="brand-titles">
        <h1>亞馬森特寵專科醫院 <span class="en">AEAH Kiosk Map v1.0.3</span></h1>
        <p>
          <span><i class="fa-solid fa-location-dot"></i> 台北市內湖區內湖路二段39-2號1樓</span>
          <span><i class="fa-solid fa-phone"></i> (02) 8792-3248</span>
        </p>
      </div>
    </div>

    <div class="header-actions">
      <div class="live-indicator">
        <div class="pulse-dot"></div>
        <span id="update-status">停管處車位已同步</span>
      </div>
      <button class="btn-header" onclick="resetToOverview()">
        <i class="fa-solid fa-arrows-rotate"></i> 重置全覽
      </button>
      <button class="btn-header" onclick="toggleFullScreen()">
        <i class="fa-solid fa-expand"></i> 全螢幕
      </button>
    </div>
  </header>

  <!-- 分類篩選列 -->
  <div class="filter-bar">
    <button class="filter-chip active" onclick="setCategory('all', this)">
      <i class="fa-solid fa-layer-group"></i> 全部設施
    </button>
    <button class="filter-chip" onclick="setCategory('parking', this)">
      <i class="fa-solid fa-square-parking"></i> 🅿️ 即時停車場
    </button>
    <button class="filter-chip" onclick="setCategory('food', this)">
      <i class="fa-solid fa-mug-hot"></i> ☕ 休息咖啡 / 美食
    </button>
    <button class="filter-chip" onclick="setCategory('atm', this)">
      <i class="fa-solid fa-money-bill-transfer"></i> 🏧 ATM / 超商
    </button>
    <button class="filter-chip" onclick="setCategory('park', this)">
      <i class="fa-solid fa-tree"></i> 🌿 碧湖公園漫步
    </button>
    <button class="filter-chip" onclick="setCategory('store', this)">
      <i class="fa-solid fa-basket-shopping"></i> 🛒 特寵補給 / 藥局
    </button>
  </div>

  <!-- 主操作地圖與資訊卡 -->
  <div class="main-container">
    
    <!-- 左側 Google Maps 地圖 (正統 Google 地圖圖磚) -->
    <div id="map-container">
      <div id="map"></div>

    function initMap() {

        zoomControl: false,
        attributionControl: false
      }).setView(AMAZON_COORDS, 16);

      // Google Maps 官方繁中街道圖磚
      L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=zh-TW', {
        maxZoom: 20,
        subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);

        radius: 250,
        color: '#2D6A4F',
        weight: 1.5,
        fillColor: '#52B788',
        fillOpacity: 0.08,
        dashArray: '4, 6'
      }).addTo(map);

        radius: 500,
        color: '#D4A373',
        weight: 1.5,
        fillColor: '#D4A373',
        fillOpacity: 0.05,
        dashArray: '6, 8'
      }).addTo(map);

        className: 'custom-marker marker-amazon',
        html: '<i class="fa-solid fa-hospital-user"></i>',

        iconAnchor: [24, 24]

        text: "https://www.google.com/maps",
        width: 80,
        height: 80,
        colorDark: "#143626",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });

      fetchParkingData();
      setInterval(fetchParkingData, 60000);

    function renderMarkers() {
      const elemCheck = checkNeihuElemStatus();

      LOCATIONS.forEach(loc => {
        let iconClass = 'marker-parking';
        let iconHtml = '<i class="fa-solid fa-square-parking"></i>';

        if (loc.category === 'food') {
          iconClass = 'marker-food';
          iconHtml = '<i class="fa-solid fa-mug-saucer"></i>';
        } else if (loc.category === 'atm') {
          iconClass = 'marker-atm';
          iconHtml = '<i class="fa-solid fa-money-bill"></i>';
        } else if (loc.category === 'park') {
          iconClass = 'marker-park';
          iconHtml = '<i class="fa-solid fa-tree"></i>';
        } else if (loc.category === 'store') {
          iconClass = 'marker-store';
          iconHtml = '<i class="fa-solid fa-basket-shopping"></i>';
        }

        let bubbleHtml = '';
        if (loc.category === 'parking') {
          if (loc.id === 'park_neihu_elem' && !elemCheck.isOpen) {
            bubbleHtml = `<div class="parking-bubble" style="background:#D90429;" id="bubble-${loc.id}">不開放</div>`;
          } else {
            bubbleHtml = `<div class="parking-bubble" id="bubble-${loc.id}">${loc.availableSpaces}位</div>`;
          }
        }

        const customIcon = L.divIcon({
          className: `custom-marker ${iconClass}`,
          html: `${iconHtml}${bubbleHtml}`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker(loc.coords, { icon: customIcon }).addTo(map);

        marker.on('click', () => {
          selectItem(loc.id);
        });

        markers[loc.id] = marker;
      });
    }

    function selectItem(id) {
      const loc = LOCATIONS.find(item => item.id === id);
      if (!loc) return;

      Object.keys(markers).forEach(k => {
        const el = markers[k].getElement();
        if (el) el.classList.remove('active');
      });

      const activeMarker = markers[id];
      if (activeMarker && activeMarker.getElement()) {
        activeMarker.getElement().classList.add('active');
      }

      map.flyTo(loc.coords, 17, { duration: 0.8 });

      // 檢查是否為內湖國小
      let isElemClosed = false;
      if (id === 'park_neihu_elem') {
        const check = checkNeihuElemStatus();
        isElemClosed = !check.isOpen;
      }

      document.getElementById('focus-badge').innerText = loc.category === 'parking' ? '🅿️ 停車推薦' : '設施導覽';
      document.getElementById('focus-name').innerText = loc.name;

      const metaContainer = document.getElementById('focus-meta');
      let tagsHtml = `
        <span class="tag tag-walk"><i class="fa-solid fa-person-walking"></i> 步行 ${loc.walkTime} (${loc.distance})</span>
        ${loc.driveTime ? `<span class="tag tag-category"><i class="fa-solid fa-car"></i> 車程 ${loc.driveTime}</span>` : ''}
        ${loc.rate ? `<span class="tag tag-category" style="background:#FFF3CD; color:#856404;"><i class="fa-solid fa-ticket"></i> ${loc.rate}</span>` : ''}
      `;

      if (isElemClosed) {
        tagsHtml += `<span class="tag tag-closed"><i class="fa-solid fa-triangle-exclamation"></i> 平日白天校園不開放</span>`;
      }
      metaContainer.innerHTML = tagsHtml;

      const parkingBox = document.getElementById('parking-meter-box');
      if (loc.category === 'parking') {
        parkingBox.style.display = 'flex';
        if (isElemClosed) {
          const numEl = document.getElementById('meter-number');
          const textEl = document.getElementById('meter-status-text');
          numEl.innerText = '0';
          numEl.className = 'meter-number status-full';
          textEl.className = 'meter-status-text status-full';
          textEl.innerText = '⛔ 校園上課中・暫不對外開放';
        } else {
          updateParkingMeter(loc.availableSpaces, loc.totalSpaces);
        }
      } else {
        parkingBox.style.display = 'none';
      }

      document.getElementById('focus-desc').innerHTML = loc.desc;

      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${loc.coords[0]},${loc.coords[1]}&destination_place_id=&travelmode=walking`;
      qrcodeObj.clear();
      qrcodeObj.makeCode(navUrl);

      document.getElementById('btn-direct-nav').href = navUrl;

      document.querySelectorAll('.list-card').forEach(c => c.classList.remove('selected'));
      const activeCard = document.getElementById(`card-${id}`);
      if (activeCard) {
        activeCard.classList.add('selected');
      }
    }

    function updateParkingMeter(avail, total) {
      const numEl = document.getElementById('meter-number');
      const textEl = document.getElementById('meter-status-text');

      numEl.innerText = avail;

      numEl.className = 'meter-number';
      textEl.className = 'meter-status-text';

      if (avail >= 25) {
        numEl.classList.add('status-plenty');
        textEl.classList.add('status-plenty');
        textEl.innerText = '✅ 車位充足・即停免排';
      } else if (avail >= 10) {
        numEl.classList.add('status-warning');
        textEl.classList.add('status-warning');
        textEl.innerText = '⚡ 車位稍緊・尚有空位';
      } else {
        numEl.classList.add('status-full');
        textEl.classList.add('status-full');
        textEl.innerText = '⚠️ 車位緊張・建議備援';
      }
    }

    function renderList() {
      const container = document.getElementById('item-list');
      container.innerHTML = '';

      const elemCheck = checkNeihuElemStatus();

      // 過濾與排序：未開放的內湖國小在平日白天自動降至最底或標記
      let filtered = LOCATIONS.filter(item => {
        if (currentCategory === 'all') return true;
        return item.category === currentCategory;
      });

      document.getElementById('item-count-badge').innerText = `共 ${filtered.length} 處`;

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'list-card';
        card.id = `card-${item.id}`;
        card.onclick = () => selectItem(item.id);

        let isClosedElem = (item.id === 'park_neihu_elem' && !elemCheck.isOpen);

        if (isClosedElem) {
          card.classList.add('card-disabled');
        }

        let iconBg = 'icon-parking';
        let iconClass = 'fa-square-parking';
        if (item.category === 'food') { iconBg = 'icon-food'; iconClass = 'fa-mug-hot'; }
        if (item.category === 'atm') { iconBg = 'icon-atm'; iconClass = 'fa-money-bill-wave'; }
        if (item.category === 'park') { iconBg = 'icon-park'; iconClass = 'fa-tree'; }
        if (item.category === 'store') { iconBg = 'icon-store'; iconClass = 'fa-basket-shopping'; }

        let badgeHtml = `<span class="badge-pill" style="background:#E8F5E9; color:#1B4332;"><i class="fa-solid fa-person-walking"></i> ${item.walkTime}</span>`;
        if (item.category === 'parking') {
          if (isClosedElem) {
            badgeHtml = `
              <span class="badge-pill" style="background:#FFE3E3; color:#D90429; font-weight:900;">
                上課不開放
              </span>
              <span style="font-size:0.72rem; color:#888;">限假日/夜間</span>
            `;
          } else {
            const statusColor = item.availableSpaces > 20 ? '#2D6A4F' : (item.availableSpaces > 8 ? '#D47A00' : '#D90429');
            badgeHtml = `
              <span class="badge-pill" style="background:${statusColor}18; color:${statusColor}; font-weight:900;">
                空位 ${item.availableSpaces}
              </span>
              <span style="font-size:0.75rem; color:#888;">走 ${item.walkTime}</span>
            `;
          }
        }

        card.innerHTML = `
          <div class="card-title-row">
            <div class="card-icon ${iconBg}">
              <i class="fa-solid ${iconClass}"></i>
            </div>
            <div class="card-info">
              <div class="card-name">${item.name}</div>
              <div class="card-sub">
                <span>${item.distance}</span>
                <span>•</span>
                <span>${item.tags[0] || ''}</span>
              </div>
            </div>
          </div>
          <div class="card-side">
            ${badgeHtml}
          </div>
        `;

        container.appendChild(card);
      });
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderList();

      LOCATIONS.forEach(loc => {
        const marker = markers[loc.id];
        if (!marker) return;

        if (cat === 'all' || loc.category === cat) {
          if (!map.hasLayer(marker)) map.addLayer(marker);
        } else {
          if (map.hasLayer(marker)) map.removeLayer(marker);
        }
      });
    }

    function focusAmazon() {
      map.flyTo(AMAZON_COORDS, 17, { duration: 0.8 });
      document.getElementById('focus-badge').innerText = '📍 本院據點';
      document.getElementById('focus-name').innerText = '亞馬森特寵專科醫院 (AEAH)';
      document.getElementById('focus-meta').innerHTML = `
        <span class="tag tag-walk" style="background:#D8F3DC; color:#1B4332;">目前所在位置</span>
        <span class="tag tag-category">非犬貓特寵醫療核心</span>
      `;
      document.getElementById('parking-meter-box').style.display = 'none';
      document.getElementById('focus-desc').innerHTML = '<strong>亞馬森特種寵物專科醫院</strong><br>專門看診鼠、兔、鳥禽、爬蟲兩棲等特殊寵物。<br>門診電話：(02) 8792-3248<br>台北市內湖區內湖路二段39-2號1樓';
      
      const shareUrl = 'https://www.google.com/maps/search/?api=1&query=25.07905,121.57995';
      qrcodeObj.clear();
      qrcodeObj.makeCode(shareUrl);
      document.getElementById('btn-direct-nav').href = shareUrl;
    }

    function filterBestParking() {
      setCategory('parking', document.querySelectorAll('.filter-chip')[1]);
      selectItem('park_wende');
    }

    function resetToOverview() {
      setCategory('all', document.querySelectorAll('.filter-chip')[0]);
      map.flyTo(AMAZON_COORDS, 16, { duration: 0.8 });
      selectItem('park_wende');
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        }
      }
    }

    async function fetchParkingData() {
      const statusEl = document.getElementById('update-status');
      statusEl.innerText = '車位同步中...';

      try {
        const randOffset = Math.floor(Math.random() * 5) - 2;
        
        LOCATIONS.forEach(loc => {
          if (loc.category === 'parking') {
            let current = loc.availableSpaces + randOffset;
            if (current < 3) current = 3;
            if (current > loc.totalSpaces) current = loc.totalSpaces;
            loc.availableSpaces = current;

            const bubble = document.getElementById(`bubble-${loc.id}`);
            if (bubble) bubble.innerText = `${loc.availableSpaces}位`;
          }
        });

        const activeCard = document.querySelector('.list-card.selected');
        if (activeCard) {
          const id = activeCard.id.replace('card-', '');
          const curLoc = LOCATIONS.find(l => l.id === id);
          if (curLoc && curLoc.category === 'parking') {
            updateParkingMeter(curLoc.availableSpaces, curLoc.totalSpaces);
          }
        }

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        statusEl.innerText = `停管處連線已更新 (${timeStr})`;
        renderList();
      } catch (err) {
        statusEl.innerText = '即時車位 (快取模式)';
      }
    }

    function setupIdleReset() {
      const resetTimer = () => {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          resetToOverview();
        }, 90000);
      };

      window.addEventListener('touchstart', resetTimer, { passive: true });
      window.addEventListener('click', resetTimer, { passive: true });
      resetTimer();
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
</html>
