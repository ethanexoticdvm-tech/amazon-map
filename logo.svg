  <ellipse cx="107" cy="50" rx="5" ry="17" fill="url(#goldGrad)" transform="rotate(15 107 50)"/>
  <!-- 品牌文字 -->
  <text x="100" y="158" font-family="'Noto Sans TC', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">亞馬森</text>
  <text x="100" y="178" font-family="sans-serif" font-size="11" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">AEAH EXOTIC</text>
