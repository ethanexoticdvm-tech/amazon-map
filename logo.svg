      <stop offset="0%" stop-color="#112D20"/>
      <stop offset="60%" stop-color="#1B4332"/>
      <stop offset="100%" stop-color="#2D6A4F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4D06F"/>
      <stop offset="100%" stop-color="#D4A373"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="6 4"/>
